- type: entity
  parent: OrganHumanEyes
  id: OrganLaserEyesXray
  name: Лазеры из глаз иксрейность
  components:
  - type: Organ
    onAdd:
    - type: HitscanBatteryAmmoProvider
      proto: XrayLaser
      fireCost: 0
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 50
    - type: Battery
      maxCharge: 100
      startingCharge: 0
    - type: Gun
      fireRate: 5
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg

