- type: entity
  id: CarpetDonk
  parent: CarpetBase
  suffix: Donk
  components:
  - type: Clickable
  - type: Sprite
    sprite: _SpyStation/Structures/Furniture/donk_carpet.rsi
  - type: Icon
    sprite: _SpyStation/Structures/Furniture/donk_carpet.rsi
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors: #excess damage (nuke?). avoid computational cost of spawning entities.
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 10
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              FloorCarpetItemWhite:
                min: 1
                max: 1
